name: EAS Build iOS

on:
  workflow_dispatch:
    inputs:
      interactivo:
        description: "Dejar que EAS revise y regenere las credenciales de Apple (responde «sí» a todo)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # La app necesita estas variables al compilar: sin la dirección de
      # Supabase abre en blanco. Se ponen en el entorno «production» del
      # proyecto de Expo desde los secretos del repositorio (05/11/2026).
      - name: Variables de la app en el entorno de producción
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_URL: ${{ secrets.EXPO_PUBLIC_WEB_URL }}
          EXPO_PUBLIC_INVITACIONES_EMAIL: ${{ secrets.EXPO_PUBLIC_INVITACIONES_EMAIL }}
        run: |
          for nombre in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_WEB_URL EXPO_PUBLIC_INVITACIONES_EMAIL; do
            valor="${!nombre}"
            if [ -z "$valor" ]; then echo "Falta el secreto $nombre"; exit 1; fi
            eas env:create --environment production --name "$nombre" --value "$valor" \
              --visibility plaintext --force --non-interactive
          done
      # Sin nadie delante, EAS necesita saber el equipo de Apple para usar la
      # llave de App Store Connect y crear el perfil de la extensión de
      # OneSignal (05/11/2026: sin esto, «Credentials are not set up»).
      - name: Build iOS IPA
        if: ${{ !inputs.interactivo }}
        env:
          EXPO_APPLE_TEAM_ID: 9BWTN3CAXU
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: eas build --platform ios --profile production --non-interactive
      # Sin nadie delante, EAS usa el perfil de Apple que tiene guardado tal
      # cual: el del 14/09 no trae los avisos push y Apple rechaza la
      # compilación. En modo interactivo lo revisa contra Apple y ofrece
      # regenerarlo; `script` le da una terminal y `yes` contesta que sí.
      - name: Olvidar la copia vieja del perfil de Apple
        if: ${{ inputs.interactivo }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node .github/scripts/olvidar-perfil-ios.mjs
      - name: Build iOS IPA (revisando credenciales)
        if: ${{ inputs.interactivo }}
        timeout-minutes: 50
        env:
          EXPO_APPLE_TEAM_ID: 9BWTN3CAXU
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: yes | script -qefc "eas build --platform ios --profile production --wait" /dev/null
